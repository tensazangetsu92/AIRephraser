services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-./deploy/production.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build: .
    image: humary-app:latest
    restart: "no"
    env_file:
      - ${APP_ENV_FILE:-./deploy/production.env}
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]

  app:
    build: .
    image: humary-app:latest
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-./deploy/production.env}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Production command: no --reload. The app has no published port and can
    # only be reached through Caddy inside the Docker network.
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # The shared edge network lets one public Caddy instance route traffic to
    # the otherwise isolated staging and production application containers.
    networks:
      default:
      humary_proxy:
        aliases:
          - ${PROXY_APP_ALIAS:-humary-app}

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    env_file:
      - ${CADDY_ENV_FILE:-./deploy/caddy.env}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ${CADDYFILE:-./deploy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
      humary_proxy:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  # Create this once on the server: docker network create humary-proxy
  # It deliberately has no public ports; only Caddy and the app containers
  # use it to communicate with each other.
  humary_proxy:
    external: true
    name: ${PROXY_NETWORK_NAME:-humary-proxy}
